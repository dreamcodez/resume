[package]
name = "resume-yew"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
gloo-net = "0.4"
gloo-timers = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-logger = "0.2"
log = "0.4"
gloo-storage = "0.2"
yew-router = "0.18"
gloo-console = "0.3"
wasm-bindgen-backend = "0.2"
base64ct = "1.7.3"
pulldown-cmark = "0.13.0"
serde_yaml = "0.9.34"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-pack = "0.12"
trunk = "0.17"
wasm-bindgen-test = "0.3"
gloo-utils = "0.2"

[lib]
crate-type = ["cdylib"]
