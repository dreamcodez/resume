[package]
name = "resume-yew"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlButtonElement",
    "HtmlImageElement",
    "Document",
    "Element",
    "Window",
    "CssStyleDeclaration",
    "Node"
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-logger = "0.2"
log = "0.4"
pulldown-cmark = "0.13.0"
serde_yaml = "0.9.34"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
image = "0.24"
headless_chrome = "1.0"

# Trunk is only needed for development builds, not WASM tests
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
trunk = "0.17"

[lib]
crate-type = ["cdylib"]
