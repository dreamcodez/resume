[package]
name = "resume-yew"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
gloo-net = "0.4"
gloo-timers = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-logger = "0.2"
log = "0.4"
gloo-storage = "0.2"
yew-router = "0.19"

[dev-dependencies]
wasm-pack = "0.12"
trunk = "0.17"

[lib]
crate-type = ["cdylib"]
